<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Harshith Ram</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg:#050505; --fg:#ededed; --muted:#7c7c84; --acid:#c6ff3d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:'Space Grotesk',sans-serif; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding:24px clamp(16px,6vw,72px); }
  .k { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--acid); letter-spacing:.15em; text-transform:uppercase; }
  h1 { font-size:clamp(96px,26vw,320px); line-height:.8; letter-spacing:-.07em; margin:20px 0; }
  h1 span { color:transparent; -webkit-text-stroke:2px var(--acid); }
  p { color:var(--muted); font-size:18px; max-width:440px; line-height:1.5; }
  a { display:inline-block; margin-top:32px; background:var(--acid); color:#000; padding:14px 22px; font-weight:700; text-decoration:none; text-transform:uppercase; font-size:14px; width:max-content; }
  a:focus-visible { outline:2px solid var(--fg); outline-offset:4px; }
</style>
</head>
<body>
  <div class="k">Error // process not found</div>
  <h1>4<span>0</span>4</h1>
  <p>This page didn't make it through the pipeline. Even bots hit an exception sometimes.</p>

</body>
